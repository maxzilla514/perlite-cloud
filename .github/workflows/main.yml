name: Sync Vault to Google Cloud Storage
on:
  push:
    branches: [main]
jobs:
  sync-vault:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Vault
        uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Sync to GCS
        run: |
          gsutil -m rsync -r ./vault gs://${{ secrets.GCS_BUCKET }}
